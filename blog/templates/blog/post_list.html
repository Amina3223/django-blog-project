{% extends "blog/base.html" %}
{% load static %}

{% block title %}
Tots els posts
{% endblock %}

{% block content %}

<h1 class="text-center mb-5">Tots els posts</h1>

<div class="row row-cols-1 row-cols-md-3 g-4">

    {% for post in posts %}

    <div class="col">

        <div class="card h-100 shadow">

            <img src="{% static 'blog/images/' %}{{ post.image_name }}"
                 class="card-img-top"
                 style="height: 220px; object-fit: cover;">

            <div class="card-body d-flex flex-column">

                <h5 class="card-title">{{ post.title }}</h5>

                <p class="card-text">{{ post.excerpt }}</p>

                <a href="{% url 'posts-detail-page' post.id %}"
                   class="btn btn-primary mt-auto">
                    Llegeix més
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
