{% extends "blog/base.html" %}
{% load static %}

{% block title %}
Tots els posts
{% endblock %}

{% block content %}

<h1 class="text-center mb-5">
    Tots els posts
</h1>

{% if posts %}

<div class="row row-cols-1 row-cols-md-3 g-4">

    {% for post in posts %}

        {% include "blog/includes/post_card.html" %}

    {% endfor %}

</div>

{% else %}

<p class="text-center text-muted">
    No hi ha posts disponibles.
</p>

{% endif %}

{% endblock %}
