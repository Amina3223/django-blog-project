{% load static %}

<div class="col">

    <div class="card h-100 shadow">

        <img src="{% static 'blog/images/'|add:post.image_name %}"
             class="card-img-top"
             style="height: 220px; object-fit: cover;">

        <div class="card-body d-flex flex-column">

            <h5 class="card-title">
                {{ post.title }}
            </h5>

            <p class="card-text">
                {{ post.excerpt }}
            </p>

            <a href="{% url 'posts-detail-page' post.id %}"
               class="btn btn-primary mt-auto">

                Llegeix més

            </a>

        </div>

    </div>

</div>
