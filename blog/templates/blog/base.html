{% load static %}

<!DOCTYPE html>
<html lang="ca" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Blog Django{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'starting-page' %}">
                Blog Django
            </a>

            <div>
                <ul class="navbar-nav d-flex flex-row gap-3">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'starting-page' %}">
                            Inici
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'posts-page' %}">
                            Posts
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'authors-page' %}">
                            Autors
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tags-page' %}">
                            Tags
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container mt-5">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
