name: Django CI i Pydoc

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: my_site.settings

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Instal·lar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar migracions
        run: |
          python manage.py migrate

      - name: Crear documentació Pydoc
        run: |
          mkdir -p docs
          python -m pydoc -w blog.models
          python -m pydoc -w blog.views
          python -m pydoc -w blog.admin
          python -m pydoc -w blog.urls
          mv blog.*.html docs/
          echo "<h1>Documentació Pydoc - Blog Django</h1>" > docs/index.html
          echo "<ul>" >> docs/index.html
          echo "<li><a href='blog.models.html'>Models</a></li>" >> docs/index.html
          echo "<li><a href='blog.views.html'>Views</a></li>" >> docs/index.html
          echo "<li><a href='blog.admin.html'>Admin</a></li>" >> docs/index.html
          echo "<li><a href='blog.urls.html'>URLs</a></li>" >> docs/index.html
          echo "</ul>" >> docs/index.html

      - name: Pujar documentació
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4